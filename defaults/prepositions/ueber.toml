preposition = "über"
meaning     = "over, above; across; about"
case        = "wechsel"
notes       = "wohin? → Akkusativ, wo? → Dativ. \"About a topic\" (sprechen über, sich freuen über) always takes the accusative."

[[sentences]]
text        = "Die Lampe hängt [über] dem Tisch."
translation = "The lamp hangs above the table."
case        = "dativ"

[[sentences]]
text        = "Wir gehen [über] die Brücke."
translation = "We're walking across the bridge."
case        = "akkusativ"

[[sentences]]
text        = "Das Flugzeug fliegt [über] die Stadt."
translation = "The plane flies over the city."
case        = "akkusativ"

[[sentences]]
text        = "Wir sprechen [über] das Wetter."
translation = "We're talking about the weather."
case        = "akkusativ"

[[sentences]]
text        = "Ich freue mich sehr [über] dein Geschenk."
translation = "I'm really pleased with your present."
case        = "akkusativ"

[[sentences]]
text        = "Die Wolken hängen tief [über] den Bergen."
translation = "The clouds hang low over the mountains."
case        = "dativ"
